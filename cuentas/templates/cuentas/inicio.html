{% extends 'base.html' %}
{% block title %}Inicio{% endblock %}
{% block page_title %}Inicio{% endblock %}
{% block content %}
<div class="card">
  <h3 style="color:#1a237e;margin-bottom:8px">
    Bienvenido, {{ request.user.get_full_name|default:request.user.username }}
  </h3>
  <p style="color:#888;font-size:0.9rem">
    Rol: {{ request.user.perfil.get_rol_display }}
  </p>
</div>
{% endblock %}
