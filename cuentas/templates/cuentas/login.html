<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — Librería Ventura</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
    }

    .card {
      display: flex;
      width: 860px;
      min-height: 480px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.4);
    }

    /* ── Panel izquierdo ── */
    .panel-izq {
      flex: 1;
      background: linear-gradient(145deg, #1565c0, #1e88e5, #42a5f5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 50px 40px;
      position: relative;
      overflow: hidden;
    }

    /* Círculos decorativos */
    .panel-izq::before {
      content: '';
      position: absolute;
      width: 280px; height: 280px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      top: -60px; left: -60px;
    }
    .panel-izq::after {
      content: '';
      position: absolute;
      width: 200px; height: 200px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      bottom: -50px; right: -50px;
    }

    .panel-izq h1 {
      color: #fff;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-align: center;
      z-index: 1;
    }

    .panel-izq p {
      color: rgba(255,255,255,0.80);
      font-size: 0.95rem;
      text-align: center;
      margin-top: 14px;
      line-height: 1.6;
      z-index: 1;
    }

    .logo {
      font-size: 3rem;
      margin-bottom: 20px;
      z-index: 1;
    }

    /* ── Panel derecho ── */
    .panel-der {
      flex: 1;
      background: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 50px 45px;
    }

    .panel-der h2 {
      font-size: 1.6rem;
      color: #1a1a2e;
      margin-bottom: 6px;
    }

    .panel-der .subtitulo {
      color: #888;
      font-size: 0.875rem;
      margin-bottom: 32px;
    }

    .campo {
      position: relative;
      margin-bottom: 20px;
    }

    .campo .icono {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #aaa;
      font-size: 1rem;
    }

    .campo input {
      width: 100%;
      padding: 13px 14px 13px 40px;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      font-size: 0.95rem;
      color: #333;
      background: #f8f9ff;
      transition: border-color 0.2s;
      outline: none;
    }

    .campo input:focus {
      border-color: #1e88e5;
      background: #fff;
    }

    .campo input::placeholder { color: #bbb; }

    .btn-ingresar {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #1565c0, #1e88e5);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 8px;
    }

    .btn-ingresar:hover  { opacity: 0.92; }
    .btn-ingresar:active { transform: scale(0.99); }

    .error {
      background: #fdecea;
      color: #c62828;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.875rem;
      margin-bottom: 18px;
      border-left: 4px solid #e53935;
    }
  </style>
</head>
<body>
  <div class="card">

    <!-- Panel izquierdo -->
    <div class="panel-izq">
      <div class="logo">📚</div>
      <h1>Librería Ventura</h1>
      <p>Sistema de punto de venta.<br>Ingresa tus credenciales para continuar.</p>
    </div>

    <!-- Panel derecho -->
    <div class="panel-der">
      <h2>Bienvenido</h2>
      <p class="subtitulo">Inicia sesión para continuar</p>

      {% if form.errors %}
        <div class="error">Usuario o contraseña incorrectos. Intenta de nuevo.</div>
      {% endif %}

      <form method="post">
        {% csrf_token %}

        <div class="campo">
          <span class="icono">👤</span>
          <input
            type="text"
            name="username"
            placeholder="Usuario"
            autocomplete="username"
            autofocus
            required
          >
        </div>

        <div class="campo">
          <span class="icono">🔒</span>
          <input
            type="password"
            name="password"
            placeholder="Contraseña"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" class="btn-ingresar">Ingresar</button>
      </form>
    </div>

  </div>
</body>
</html>
